[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "delegate-chain"
version = "1.0.0"
description = "Hierarchical multi-agent delegation system where each engineering level delegates tasks down and reviews work up"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "boto3>=1.34",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
delegate-chain = "delegate_chain.run:main"

[tool.hatch.build.targets.wheel]
packages = ["src/delegate_chain"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
# Prompt text files: rewrapping changes what the LLM receives
"src/delegate_chain/build/graph.py" = ["E501"]
"src/delegate_chain/build/multi.py" = ["E501"]
"src/delegate_chain/build/ingest.py" = ["E501"]
"src/delegate_chain/build/workspace.py" = ["E501"]
"src/delegate_chain/core/orchestrator.py" = ["E501"]
"src/delegate_chain/core/rubric.py" = ["E501"]
"src/delegate_chain/eval/gate_check.py" = ["E501"]
"src/delegate_chain/run.py" = ["E501"]
"src/delegate_chain/core/kb.py" = ["E501"]
"src/delegate_chain/llm/client.py" = ["E501"]
"src/delegate_chain/build/agent.py" = ["E501"]
"src/delegate_chain/build/repo.py" = ["E501"]
"src/delegate_chain/build/run.py" = ["E501"]
"src/delegate_chain/build/sandbox.py" = ["E501"]
"tests/conftest.py" = ["E501"]
"src/delegate_chain/agents/level_agent.py" = ["E501"]
# Examples directory: generated code, not hand-authored
"examples/**/*.py" = ["E501", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
